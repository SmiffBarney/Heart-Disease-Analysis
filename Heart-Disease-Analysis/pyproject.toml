[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Heart-Disease-Analysis"
version = "0.0.1"
description = "Gaining an in depth understanding of the results from the Framingham heart disease study and to be able to predict the 10 yr risk of heart disease of individuals"
authors = [
  { name = "Sean Niez" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["Heart-Disease-Analysis"]
force_sort_within_sections = true
